name: Deploy Docs to GitHub Pages

# Docs deploy on pushes to main that touch the docs (or the bear shader the
# docs sync from the admin app), and on GitHub Releases. workflow_dispatch
# remains for a manual rebuild.
on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "admin/src/assets/shader/bear-face_*.glsl"
      - ".github/workflows/deploy-docs.yml"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        working-directory: website
        run: npm ci

      - name: Build
        working-directory: website
        env:
          # Project site is served from /<repo>/, not from the domain root.
          VITEPRESS_BASE: /${{ github.event.repository.name }}/
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: website/docs/.vitepress/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
