name: ${APP_NAME}

x-megadex-healthcheck: &megadexHealthcheck
  # /megadex/health/ready also proves Postgres is reachable; /megadex/health is liveness only.
  test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/megadex/health/ready"]
  interval: 10s
  timeout: 5s
  retries: 5

x-gatelin-healthcheck: &gatelinHealthcheck
  test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/gatelin/health/ready"]
  interval: 10s
  timeout: 5s
  retries: 5

services:

  postgres:
    platform: linux/amd64
    build:
      context: ${PWD}/db/pgsql
      dockerfile: dockerfile
      args:
        - POSTGRES_VERSION=${POSTGRES_VERSION}
    container_name: ${POSTGRES_HOST}
    hostname: ${POSTGRES_HOST}
    environment:
      TZ: ${TZ}
      POSTGRES_DBS: ${POSTGRES_DBS}
      POSTGRES_USER: ${POSTGRES_ROOT_USER}
      POSTGRES_PASSWORD: ${POSTGRES_ROOT_PWD}
      LIQUIBASE_USER: ${LIQUIBASE_DB_USER}
      LIQUIBASE_PWD: ${LIQUIBASE_DB_PWD}
      GATELIN_USER: ${GATELIN_DB_USER}
      GATELIN_PWD: ${GATELIN_DB_PWD}
      MEGADEX_USER: ${MEGADEX_DB_USER}
      MEGADEX_PWD: ${MEGADEX_DB_PWD}
    networks:
      - internal
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_ROOT_USER}", "-d", "${MEGADEX_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 3

  traefik:
    image: traefik:${TRAEFIK_VERSION}
    container_name: ${TRAEFIK_HOST}
    hostname: ${TRAEFIK_HOST}
    command:
      - --providers.docker=true
      - --providers.docker.network=${APP_NAME}-internal-${ENV_NAME}
      - --providers.docker.constraints=Label(`stack.name`,`${APP_NAME}-${ENV_NAME}`)
      - --entryPoints.web.address=${TRAEFIK_ENTRYPOINTS_WEB_ADDRESS}
      # forwardedHeaders.insecure is deliberately NOT set: Traefik is the edge,
      # so a client-supplied X-Forwarded-For would be trusted verbatim.
      - --providers.docker.exposedByDefault=${TRAEFIK_PROVIDERS_DOCKER_EXPOSEDBYDEFAULT}
      - --api.insecure=${TRAEFIK_API_INSECURE}
      - --log.level=${TRAEFIK_LOG_LEVEL}
      - --accesslog=${TRAEFIK_ACCESSLOG}
      - --ping=true
    labels:
      - "traefik.enable=true"
      - "stack.name=${STACK_NAME}"
    restart: always
    ports:
      - ${TRAEFIK_PORT}:80
    networks:
      - internal
      - external
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  gatelin_migration:
    image: ghcr.io/alten-group/gatelin-migration:${GATELIN_VERSION:-0.1.0-alpha.11}
    container_name: ${GATELIN_MIGRATION_HOST}
    hostname: ${GATELIN_MIGRATION_HOST}
    environment:
      TZ: ${TZ}
      LIQUIBASE_COMMAND_USERNAME: ${LIQUIBASE_DB_USER}
      LIQUIBASE_COMMAND_PASSWORD: ${LIQUIBASE_DB_PWD}
      DB_HOST: ${POSTGRES_HOST}
      DB_PORT: ${POSTGRES_PORT}
      DB_NAME: ${GATELIN_DB_NAME}
      DB_USER: ${GATELIN_DB_USER}
      DB_PWD: ${GATELIN_DB_PWD}
      DB_JOB_USER: ${GATELIN_DB_JOB_USER}
      DB_JOB_PWD: ${GATELIN_DB_JOB_PWD}
      UPDATE: ${LIQUIBASE_UPDATE}
      ROLLBACK: ${LIQUIBASE_ROLLBACK}
      SNAPSHOT: snapshot/snapshot${LIQUIBASE_SNAPSHOT}
      LIQUIBASE_LOG_LEVEL: ${LIQUIBASE_LOG_LEVEL}
      LIQUIBASE_COMMAND_CONTEXTS: ${LIQUIBASE_COMMAND_CONTEXTS}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal
    volumes:
      # Megadex route/service seed applied after Gatelin core schema
      - ${PWD}/db/liquibase/gatelin-data/:/liquibase/data

  gatelin:
    image: ghcr.io/alten-group/gatelin:${GATELIN_VERSION:-0.1.0-alpha.11}
    container_name: ${GATELIN_HOST}
    hostname: ${GATELIN_HOST}
    environment:
      PORT: ${DEFAULT_PORT}
      TZ: ${TZ}
      PWD_CHECK_URL: ${GATELIN_PWD_CHECK_URL}
      PWD_CHALLENGES_URL: ${GATELIN_PWD_CHALLENGES_URL}
      PWD_TRUSTED_DEVICES_URL: ${GATELIN_PWD_TRUSTED_DEVICES_URL}
      PWD_LOGIN_TICKET_URL: ${GATELIN_PWD_LOGIN_TICKET_URL}
      USER_SEARCH_URL: ${MEGADEX_USER_SEARCH_URL}
      DB_HOST: ${POSTGRES_HOST}
      DB_NAME: ${GATELIN_DB_NAME}
      DB_USER: ${GATELIN_DB_USER}
      DB_PWD: ${GATELIN_DB_PWD}
      DB_JOB_USER: ${GATELIN_DB_JOB_USER}
      DB_JOB_PWD: ${GATELIN_DB_JOB_PWD}
      TOKEN_SECRET: ${GATELIN_TOKEN_SECRET}
      APP_NAME: ${APP_NAME}
      ENV_NAME: ${ENV_NAME}
      SERVER_SCHEME: ${SERVER_SCHEME}
      SERVICE_NAME: ${GATELIN_HOST}
      ACCESS_TOKEN_DURATION: ${GATELIN_ACCESS_TOKEN_DURATION}
      REFRESH_TOKEN_DURATION: ${GATELIN_REFRESH_TOKEN_DURATION}
      REFRESH_TOKEN_COOKIE: ${GATELIN_REFRESH_TOKEN_COOKIE}
      REFRESH_TOKEN_COOKIE_HTTPS_ONLY: ${GATELIN_REFRESH_TOKEN_COOKIE_HTTPS_ONLY:-true}
    depends_on:
      postgres:
        condition: service_healthy
      gatelin_migration:
        condition: service_completed_successfully
    networks:
      - internal
    labels:
      - "traefik.enable=true"
      - "stack.name=${STACK_NAME}"
      - "traefik.http.routers.gatelin.rule=PathPrefix(`/api`)"
      - "traefik.http.routers.gatelin.entrypoints=web"
      - "traefik.http.routers.gatelin.service=gatelin"
      - "traefik.http.routers.gatelin.middlewares=strip-prefix"
      - "traefik.http.middlewares.strip-prefix.stripprefix.prefixes=/api"
      - "traefik.http.middlewares.strip-prefix.stripprefix.forceSlash=false"
      - "traefik.http.services.gatelin.loadBalancer.server.port=${DEFAULT_PORT}"
    healthcheck: *gatelinHealthcheck

  megadex_migration:
    build:
      context: ${PWD}/db/liquibase
      dockerfile: dockerfile.prod
      args:
        LIQUIBASE_VERSION: ${LIQUIBASE_VERSION}
    image: ghcr.io/alten-group/megadex-migration:${VERSION:-latest}
    container_name: ${MEGADEX_MIGRATION_HOST}
    hostname: ${MEGADEX_MIGRATION_HOST}
    environment:
      TZ: ${TZ}
      LIQUIBASE_COMMAND_USERNAME: ${LIQUIBASE_DB_USER}
      LIQUIBASE_COMMAND_PASSWORD: ${LIQUIBASE_DB_PWD}
      DB_HOST: ${POSTGRES_HOST}
      DB_PORT: ${POSTGRES_PORT}
      DB_NAME: ${MEGADEX_DB_NAME}
      DB_USER: ${MEGADEX_DB_USER}
      DB_PWD: ${MEGADEX_DB_PWD}
      DB_JOB_USER: ${MEGADEX_DB_JOB_USER}
      DB_JOB_PWD: ${MEGADEX_DB_JOB_PWD}
      UPDATE: ${LIQUIBASE_UPDATE}
      ROLLBACK: ${LIQUIBASE_ROLLBACK}
      SNAPSHOT: snapshot/snapshot${LIQUIBASE_SNAPSHOT}
      LIQUIBASE_LOG_LEVEL: ${LIQUIBASE_LOG_LEVEL}
      LIQUIBASE_COMMAND_CONTEXTS: ${LIQUIBASE_COMMAND_CONTEXTS}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal

  megadex:
    image: ghcr.io/alten-group/megadex:${VERSION:-latest}
    container_name: ${MEGADEX_HOST}
    hostname: ${MEGADEX_HOST}
    environment:
      PORT: ${DEFAULT_PORT}
      TZ: ${TZ}
      DB_HOST: ${POSTGRES_HOST}
      DB_NAME: ${MEGADEX_DB_NAME}
      DB_USER: ${MEGADEX_DB_USER}
      DB_PWD: ${MEGADEX_DB_PWD}
      DB_JOB_USER: ${MEGADEX_DB_JOB_USER}
      DB_JOB_PWD: ${MEGADEX_DB_JOB_PWD}
      APP_NAME: ${APP_NAME}
      ENV_NAME: ${ENV_NAME}
      SERVER_SCHEME: ${SERVER_SCHEME}
      SERVICE_NAME: ${MEGADEX_HOST}
      PWD_CREATE_URL: ${MEGADEX_PWD_CREATE_URL:-}
      # Bundled admin UI, served on a dedicated internal port.
      ADMIN_PORT: ${ADMIN_PORT}
      ADMIN_BASE_PATH: ${ADMIN_BASE_PATH:-/megadex}
      ADMIN_SSO_TOKEN_KEY: ${ADMIN_SSO_TOKEN_KEY:-}
      ADMIN_ROLES_SEARCH_URL: ${ADMIN_ROLES_SEARCH_URL:-/api/gatelin/roles/search}
    depends_on:
      postgres:
        condition: service_healthy
      megadex_migration:
        condition: service_completed_successfully
    networks:
      - internal
    labels:
      - "traefik.enable=true"
      - "stack.name=${STACK_NAME}"
      - "traefik.http.routers.megadex-admin.rule=PathPrefix(`${ADMIN_BASE_PATH:-/megadex}`)"
      - "traefik.http.routers.megadex-admin.entrypoints=web"
      - "traefik.http.routers.megadex-admin.service=megadex-admin"
      - "traefik.http.services.megadex-admin.loadbalancer.server.port=${ADMIN_PORT}"
    # Only the admin port is public through Traefik. API traffic is expected to
    # go through Gatelin on the internal network.
    healthcheck: *megadexHealthcheck

networks:
  internal:
    name: ${APP_NAME}-internal-${ENV_NAME}
    driver: bridge
  external:
    name: ${APP_NAME}-external-${ENV_NAME}
    driver: bridge

volumes:
  postgres_data:
    driver: local
