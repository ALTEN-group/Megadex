<!-- Megadex favicon — stylised M knocked out of the brand gradient diamond. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="megadexTile" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#4338CA" />
    </linearGradient>
  </defs>
  <!-- Flat-top hexagon stretched to fill the whole 64x64 box, with long flat edges on top and bottom like the previous square tile; the round-joined stroke softens the corners. -->
  <polygon points="62,32 51,62 13,62 2,32 13,2 51,2" fill="url(#megadexTile)" stroke="url(#megadexTile)" stroke-width="4" stroke-linejoin="round" />
  <!--
    The M is the logo path (73x100 viewBox) at natural proportions, 42px tall and centred. Same size and position as on the previous square favicon.
    Solid white, no outline.
  -->
  <g transform="translate(16.88 11) scale(0.42)">
    <path d="M 0 100 L 0 0 L 18 0 L 36 36 L 54 0 L 72 0 L 72 100
             L 54 100 L 54 38 L 36 72 L 18 38 L 18 100 Z"
          fill="#fff" />
  </g>
</svg>
